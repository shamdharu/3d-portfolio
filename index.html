<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abishek Varshan - Desert Road Trip</title>
<style>
:root{--bg:#e6bf8a;--fg:#fff3d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif;touch-action:none;cursor:crosshair}
canvas{display:block}
#hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;text-shadow:0 1px 3px #000,0 2px 8px #3a1a00cc;line-height:1.5;pointer-events:none;z-index:10}
#hud b{font-size:30px}
#help{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:16px;font-size:14px;line-height:1.55;font-weight:700;text-align:right;color:#fff9e6;background:rgba(35,15,0,.62);padding:8px 12px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.35);text-shadow:0 1px 3px #000;pointer-events:none;z-index:10}
#film{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(50,20,0,.6) 100%),linear-gradient(rgba(255,170,80,.08),rgba(255,120,40,.12))}
#grain{position:fixed;inset:0;pointer-events:none;opacity:.14;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.btn{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:70px;height:70px;border-radius:50%;background:#00000044;border:2px solid #fff8;color:#fff;font-size:26px;display:none;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;z-index:5}
@media (pointer:coarse){.btn{display:flex}#help{font-size:12px}}
#mm{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:160px;height:160px;border-radius:50%;border:5px solid #4a2314;box-shadow:0 0 0 3px #e8a23a,0 6px 16px rgba(0,0,0,.55);z-index:6;pointer-events:none;background:#e6c88c}
@media (pointer:coarse){#mm{bottom:calc(112px + env(safe-area-inset-bottom,0px));width:130px;height:130px}}
#danger{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:4;background:radial-gradient(ellipse at center,transparent 45%,rgba(190,10,0,.6) 100%)}
#toast{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);opacity:0;transition:opacity .5s;z-index:15;pointer-events:none;background:#fbf0d0;color:#3b1f10;border:4px solid #6e3b20;border-radius:14px;padding:10px 18px;font:700 17px 'Trebuchet MS',Arial,sans-serif;text-align:center;max-width:86vw}
#over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(60,5,0,.62);z-index:30;touch-action:auto;cursor:default}
#over .card{max-width:min(460px,88vw);background:#fbf0d0;border:6px solid #6e3b20;outline:3px solid #a63c1f;border-radius:18px;padding:22px 28px;text-align:center;color:#3b1f10;box-shadow:0 10px 40px rgba(0,0,0,.6)}
#over .kick{font:900 34px Impact,'Arial Black',sans-serif;letter-spacing:.06em;color:#a63c1f;text-transform:uppercase}
#over p{font:600 17px/1.4 'Trebuchet MS',Arial,sans-serif;margin:10px 0 16px}
#over button{font:700 17px 'Trebuchet MS',Arial,sans-serif;background:#a63c1f;color:#fbf0d0;border:0;border-radius:22px;padding:10px 26px;cursor:pointer}
</style>
</head>

        y+=h;

  }
  for(let k=0;k<3;k++){
    const x=i*CH+r()*CH,z=j*CH+r()*CH,n=1+Math.floor(r()*2);

  }

function updateChunks(){
  const ci=Math.floor(carPos.x/CH),cj=Math.floor(carPos.z/CH);
  for(let i=ci-R;i<=ci+R;i++)for(let j=cj-R;j<=cj+R;j++)if(!chunks.has(i+','+j))makeChunk(i,j);

const ray=new THREE.Raycaster(),mNDC=new THREE.Vector2(),trPool=[],_o=new THREE.Vector3(),_e=new THREE.Vector3(),_v=new THREE.Vector3();let trI=0;

function update(dt){
  const up=!gameOver&&(keys.KeyW||keys.ArrowUp),dn=!gameOver&&(keys.KeyS||keys.ArrowDown);
  const lf=keys.KeyA||keys.ArrowLeft,rt=keys.KeyD||keys.ArrowRight;
  const boost=keys.ShiftLeft||keys.ShiftRight,maxS=boost?55:35;
  if(up)speed+=(boost?45:28)*dt;
  else if(dn)speed-=32*dt;
  else speed-=Math.sign(speed)*Math.min(Math.abs(speed),8*dt);
  if(keys.Space)speed-=Math.sign(speed)*Math.min(Math.abs(speed),50*dt);
  speed=Math.max(-14,Math.min(maxS,speed));
  steer+=(((lf?1:0)-(rt?1:0))-steer)*Math.min(1,8*dt);
  heading+=steer*1.9*dt*Math.max(-1,Math.min(1,speed/8));
  dir.set(Math.sin(heading),0,Math.cos(heading));
  carPos.addScaledVector(dir,speed*dt);
  car.position.set(carPos.x,hgt(carPos.x,carPos.z),carPos.z);
  car.rotation.order='YXZ';car.rotation.set(0,heading,-steer*speed*0.003);

  for(const list of chunks.values())for(const m of list){
    const d=m.userData,p=m.position;
    if(!d.hit){
      if(d.level>0)continue;
      const dx=p.x-carPos.x,dz=p.z-carPos.z;
      if(dx*dx+dz*dz>100)continue;
      const dist=Math.hypot(dx,dz);
      if(dist<d.s*0.6+1.3&&Math.abs(speed)>1){
        const nx=dx/(dist||1),nz=dz/(dist||1),f=Math.abs(speed);
        d.stack.forEach((b,ix)=>{const u=b.userData;u.hit=true;score++;
          u.v.set(dir.x*speed*.8+nx*5+(Math.random()-.5)*4,3+f*.2+ix*1.5,dir.z*speed*.8+nz*5+(Math.random()-.5)*4);
          u.av.set((Math.random()-.5)*10,(Math.random()-.5)*10,(Math.random()-.5)*10)});
        scoreEl.textContent=score;speed*=0.94;
      }
    }else{
      d.v.y-=25*dt;p.addScaledVector(d.v,dt);
      m.rotation.x+=d.av.x*dt;m.rotation.y+=d.av.y*dt;m.rotation.z+=d.av.z*dt;
      const floor=hgt(p.x,p.z)+d.h/2-0.1;
      if(p.y<floor){
        p.y=floor;
        if(Math.abs(d.v.y)>2)d.v.y*=-0.3;else d.v.y=0;
        d.v.x*=0.6;d.v.z*=0.6;d.av.multiplyScalar(0.55);
        m.rotation.x+=(Math.round(m.rotation.x/HP)*HP-m.rotation.x)*0.2;
        m.rotation.z+=(Math.round(m.rotation.z/HP)*HP-m.rotation.z)*0.2;
      }
      if(d.v.y===0){d.v.x*=0.95;d.v.z*=0.95;d.av.multiplyScalar(0.92)}
    }
  }
  updateChunks();updateGround(carPos.x,carPos.z);
  sun.position.set(carPos.x+sunDir.x*150,sunDir.y*150,carPos.z+sunDir.z*150);sun.target.position.copy(carPos);
  spdEl.textContent=Math.round(Math.abs(speed)*3.6);

  updateTumble(dt);
  const T=STATIONS[stage];
  if(T){
    const dist=Math.hypot(T.x-carPos.x,T.z-carPos.z);
    navEl.textContent=(T.tr?'Treasure - drive up to open ':'Board '+(stage+1)+' ')+Math.round(dist)+' m';
    if(T.tr){if(dist<10)openTreasure()}else if(dist<14)stage++;
  }else navEl.textContent='Treasure found! Keep smashing rocks';
  animTreasure(dt);updateGiants(dt);updatePickups(dt);drawMinimap();

  const back=new THREE.Vector3(-dir.x*10,5,-dir.z*10).add(car.position);
  camera.position.lerp(back,Math.min(1,5*dt));
  if(shake>0){camera.position.x+=(Math.random()-.5)*shake;camera.position.y+=(Math.random()-.5)*shake*.7}
  camera.lookAt(carPos.x+dir.x*5,car.position.y+1.6,carPos.z+dir.z*5);
  camera.fov=62+Math.abs(speed)*0.35;camera.updateProjectionMatrix();
  shoot(dt);
  sky.position.copy(camera.position);
  sunDisc.position.copy(camera.position).addScaledVector(sunDir,440);
  const a=dp;
  for(let i=0;i<DN;i++){
    a[i*3]+=(2.5+Math.sin(i))*dt;a[i*3+1]+=Math.sin(performance.now()/900+i)*0.02;a[i*3+2]+=0.8*dt;
    for(const ax of [0,2]){const c=ax?camera.position.z:camera.position.x,v=a[i*3+ax]-c;if(v>70)a[i*3+ax]-=140;else if(v<-70)a[i*3+ax]+=140}
  }
  dg.attributes.position.needsUpdate=true;
}
