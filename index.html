const box=new THREE.BoxGeometry(1,1,1);
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function addRock(list,stack,level,x,z,y,w,h,d,ry,r){
  const m=new THREE.Mesh(box,rockMats[Math.floor(r()*rockMats.length)]);
  m.scale.set(w,h,d);m.position.set(x,y+h/2,z);m.rotation.set((r()-.5)*0.04,ry,(r()-.5)*0.04);
  m.castShadow=true;m.receiveShadow=true;
  m.userData={h,s:Math.max(w,d),hit:false,v:new THREE.Vector3(),av:new THREE.Vector3(),stack,level};
  stack.push(m);list.push(m);scene.add(m);
}
function makeChunk(i,j){
  const r=rng(i*73856093^j*19349663^1234);
  const list=[];
  const fx=i*CH+10+r()*(CH-20),fz=j*CH+10+r()*(CH-20);
  if(!nearStation(fx,fz,34)){
    const ang=r()*Math.PI*2,ca=Math.cos(ang),sa=Math.sin(ang),base=2+Math.floor(r()*3);
    [base,Math.max(1,base-1),Math.max(1,base-2),1].forEach((n,k)=>{
      const px=fx+ca*k*4.4+(r()-.5)*1.4,pz=fz+sa*k*4.4+(r()-.5)*1.4;
      const stack=[],bw=3+r()*1.3,bd=3+r()*1.3;let y=hgt(px,pz)-0.15;
      for(let l=0;l<n;l++){
        const h=1.8+r()*1.2,sh=1-l*0.07;
        addRock(list,stack,l,px+(l?(r()-.5)*0.7:0),pz+(l?(r()-.5)*0.7:0),y,bw*sh*(0.9+r()*.2),h,bd*sh*(0.9+r()*.2),ang+(r()-.5)*0.5,r);
        y+=h;
      }
    });
  }
  for(let k=0;k<3;k++){
    const x=i*CH+r()*CH,z=j*CH+r()*CH,n=1+Math.floor(r()*2);
    if(nearStation(x,z,26)){r();continue}
    const stack=[];let y=hgt(x,z)-0.15;
    for(let l=0;l<n;l++){const h=1.5+r()*1.3;addRock(list,stack,l,x,z,y,2.4+r()*1.6,h,2.4+r()*1.6,r()*3,r);y+=h}
  }
  chunks.set(i+','+j,list);
}
function updateChunks(){
  const ci=Math.floor(carPos.x/CH),cj=Math.floor(carPos.z/CH);
  for(let i=ci-R;i<=ci+R;i++)for(let j=cj-R;j<=cj+R;j++)if(!chunks.has(i+','+j))makeChunk(i,j);
  for(const [key,list] of chunks){
    const [i,j]=key.split(',').map(Number);
    if(Math.abs(i-ci)>R+1||Math.abs(j-cj)>R+1){list.forEach(m=>scene.remove(m));chunks.delete(key)}
  }
}

  {const t=Math.max(20,L-42);plantArrow(prev.x+d.x*t+d.z*13,prev.z+d.z*t-d.x*13,yaw)}
  const b=new THREE.Group(),bx=P.x+d.x*20,bz=P.z+d.z*20;
  b.position.set(bx,hgt(bx,bz),bz);b.rotation.y=Math.atan2(-d.x,-d.z);b.scale.setScalar(1.15);
  [-14,14].forEach(x=>{const po=new THREE.Mesh(new THREE.BoxGeometry(0.7,4.4,0.7),steel);po.position.set(x,2.2,0);po.castShadow=true;b.add(po);const br=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.4,5.4),steel);br.position.set(x,1.8,-2.5);br.rotation.x=-0.73;br.castShadow=true;b.add(br)});
  const fr=new THREE.Mesh(new THREE.BoxGeometry(31.6,20.2,0.7),frameM);fr.position.y=13;fr.castShadow=true;b.add(fr);
  const pl=new THREE.Mesh(new THREE.PlaneGeometry(30,18.75),new THREE.MeshBasicMaterial({map:boardTex(s,k),toneMapped:false}));
  pl.position.set(0,13,0.45);b.add(pl);
  [-10,10].forEach(x=>{const l=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.7,1.6),steel);l.position.set(x,23.7,1.2);l.rotation.x=0.4;b.add(l);const gl=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.4,0.1),lampM);gl.position.set(x,23.5,2.0);gl.rotation.x=0.4;b.add(gl)});
  scene.add(b);
  STATIONS.push({x:P.x,z:P.z,title:s.t});
  prev=P;
});
function nearStation(x,z,r){
  if(x*x+z*z<r*r*0.4)return true;
  return STATIONS.some(s=>{const dx=s.x-x,dz=s.z-z;return dx*dx+dz*dz<r*r});
}
let stage=0;const navEl=document.getElementById('nav');

// Floating dust
const DN=260,dp=new Float32Array(DN*3);
for(let i=0;i<DN;i++){dp[i*3]=(Math.random()-.5)*140;dp[i*3+1]=0.5+Math.random()*14;dp[i*3+2]=(Math.random()-.5)*140}
const dg=new THREE.BufferGeometry();dg.setAttribute('position',new THREE.BufferAttribute(dp,3));
const dust=new THREE.Points(dg,new THREE.PointsMaterial({color:0xffe2b0,size:0.5,transparent:true,opacity:0.45,depthWrite:false}));
dust.frustumCulled=false;scene.add(dust);

// Tumbleweeds
const twMat=new THREE.MeshLambertMaterial({color:0x8a6a3a,emissive:0x1e1408});
const twMat2=new THREE.MeshLambertMaterial({color:0xa98550,emissive:0x1e1408});
const twG=[new THREE.TorusGeometry(1,0.035,4,14),new THREE.TorusGeometry(0.75,0.03,4,12)];
const wind=new THREE.Vector3(0.93,0,0.37).normalize();
const tumbles=[];
function makeTumble(){
  const g=new THREE.Group(),ball=new THREE.Group();
  for(let i=0;i<22;i++){
    const m=new THREE.Mesh(twG[i%2],i%3?twMat:twMat2);
    m.rotation.set(Math.random()*6.3,Math.random()*6.3,Math.random()*6.3);
    m.scale.setScalar(0.75+Math.random()*0.3);m.castShadow=true;ball.add(m);
  }
  g.add(ball);
  const sc=0.8+Math.random()*1.0;ball.scale.setScalar(sc);
  scene.add(g);
  const t={g,ball,r:sc,sp:2.5+Math.random()*3,ph:Math.random()*10,hop:0.25+Math.random()*0.5};
  placeTumble(t,15+Math.random()*125);
  tumbles.push(t);
}
function placeTumble(t,rad){
  const a=Math.random()*Math.PI*2;
  t.g.position.set(carPos.x+Math.cos(a)*rad,0,carPos.z+Math.sin(a)*rad);
}
const axis=new THREE.Vector3();
function updateTumble(dt){
  const now=performance.now()/1000;
  tumbles.forEach(t=>{
    const gust=1+0.5*Math.sin(now*0.5+t.ph);
    const v=t.sp*gust*dt,p=t.g.position;
    p.x+=wind.x*v+Math.sin(now*0.8+t.ph)*0.4*dt;p.z+=wind.z*v;
    const dx=p.x-carPos.x,dz=p.z-carPos.z,dd=Math.hypot(dx,dz);
    if(dd<t.r+1.8&&Math.abs(speed)>2){p.x+=dx/dd*3*dt*Math.abs(speed);p.z+=dz/dd*3*dt*Math.abs(speed);t.ph+=0.3}
    if(dd>150){placeTumble(t,120+Math.random()*25);p.x-=wind.x*60;p.z-=wind.z*60}
    axis.set(wind.z,0,-wind.x);
    t.ball.rotateOnWorldAxis(axis,v/t.r);
    p.y=hgt(p.x,p.z)+t.r*0.85+Math.abs(Math.sin(now*2.2*t.sp/3+t.ph))*t.hop;
  });
}

// Controls
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR')resetCar();if(e.code==='Space')e.preventDefault()});
addEventListener('keyup',e=>keys[e.code]=false);
[['bl','KeyA'],['br','KeyD'],['bg','KeyW'],['bb','KeyS']].forEach(([id,code])=>{
  const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{keys[code]=true;e.preventDefault()});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>keys[code]=false));
});

const carPos=new THREE.Vector3(0,0,0);
let heading=0,speed=0,score=0,steer=0;
const scoreEl=document.getElementById('score'),spdEl=document.getElementById('spd');
function resetCar(){carPos.set(0,0,0);heading=0;speed=0}
const dir=new THREE.Vector3(),HP=Math.PI/2;

function update(dt){
  const up=keys.KeyW||keys.ArrowUp,dn=keys.KeyS||keys.ArrowDown;
  const lf=keys.KeyA||keys.ArrowLeft,rt=keys.KeyD||keys.ArrowRight;
  const boost=keys.ShiftLeft||keys.ShiftRight,maxS=boost?55:35;
  if(up)speed+=(boost?45:28)*dt;
  else if(dn)speed-=32*dt;
  else speed-=Math.sign(speed)*Math.min(Math.abs(speed),8*dt);
  if(keys.Space)speed-=Math.sign(speed)*Math.min(Math.abs(speed),50*dt);
  speed=Math.max(-14,Math.min(maxS,speed));
  steer+=(((lf?1:0)-(rt?1:0))-steer)*Math.min(1,8*dt);
  heading+=steer*1.9*dt*Math.max(-1,Math.min(1,speed/8));
  dir.set(Math.sin(heading),0,Math.cos(heading));
  carPos.addScaledVector(dir,speed*dt);
  car.position.set(carPos.x,hgt(carPos.x,carPos.z),carPos.z);
  car.rotation.order='YXZ';car.rotation.set(0,heading,-steer*speed*0.003);

  for(const list of chunks.values())for(const m of list){
    const d=m.userData,p=m.position;
    if(!d.hit){
      if(d.level>0)continue;
      const dx=p.x-carPos.x,dz=p.z-carPos.z;
      if(dx*dx+dz*dz>100)continue;
      const dist=Math.hypot(dx,dz);
      if(dist<d.s*0.6+1.3&&Math.abs(speed)>1){
        const nx=dx/(dist||1),nz=dz/(dist||1),f=Math.abs(speed);
        d.stack.forEach((b,ix)=>{const u=b.userData;u.hit=true;score++;
          u.v.set(dir.x*speed*.8+nx*5+(Math.random()-.5)*4,3+f*.2+ix*1.5,dir.z*speed*.8+nz*5+(Math.random()-.5)*4);
          u.av.set((Math.random()-.5)*10,(Math.random()-.5)*10,(Math.random()-.5)*10)});
        scoreEl.textContent=score;speed*=0.94;
      }
    }else{
      d.v.y-=25*dt;p.addScaledVector(d.v,dt);
      m.rotation.x+=d.av.x*dt;m.rotation.y+=d.av.y*dt;m.rotation.z+=d.av.z*dt;
      const floor=hgt(p.x,p.z)+d.h/2-0.1;
      if(p.y<floor){
        p.y=floor;
        if(Math.abs(d.v.y)>2)d.v.y*=-0.3;else d.v.y=0;
        d.v.x*=0.6;d.v.z*=0.6;d.av.multiplyScalar(0.55);
        m.rotation.x+=(Math.round(m.rotation.x/HP)*HP-m.rotation.x)*0.2;
        m.rotation.z+=(Math.round(m.rotation.z/HP)*HP-m.rotation.z)*0.2;
      }
      if(d.v.y===0){d.v.x*=0.95;d.v.z*=0.95;d.av.multiplyScalar(0.92)}
    }
  }
  updateChunks();updateGround(carPos.x,carPos.z);
  sun.position.set(carPos.x+sunDir.x*150,sunDir.y*150,carPos.z+sunDir.z*150);sun.target.position.copy(carPos);
  spdEl.textContent=Math.round(Math.abs(speed)*3.6);

  updateTumble(dt);
  const T=STATIONS[stage];
  if(T){
    const dist=Math.hypot(T.x-carPos.x,T.z-carPos.z);
    navEl.textContent='Next: '+T.title+' • '+Math.round(dist)+' m — look for the arrow beside the route';
    if(dist<14)stage++;
  }else navEl.textContent='All read! Keep smashing rocks';

  const back=new THREE.Vector3(-dir.x*10,5,-dir.z*10).add(car.position);
  camera.position.lerp(back,Math.min(1,5*dt));
  camera.lookAt(carPos.x+dir.x*5,car.position.y+1.6,carPos.z+dir.z*5);
  camera.fov=62+Math.abs(speed)*0.35;camera.updateProjectionMatrix();
  sky.position.copy(camera.position);
  sunDisc.position.copy(camera.position).addScaledVector(sunDir,440);
  const a=dp;
  for(let i=0;i<DN;i++){
    a[i*3]+=(2.5+Math.sin(i))*dt;a[i*3+1]+=Math.sin(performance.now()/900+i)*0.02;a[i*3+2]+=0.8*dt;
    for(const ax of [0,2]){const c=ax?camera.position.z:camera.position.x,v=a[i*3+ax]-c;if(v>70)a[i*3+ax]-=140;else if(v<-70)a[i*3+ax]+=140}
  }
  dg.attributes.position.needsUpdate=true;
}

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
camera.position.set(0,5,-10);
for(let i=0;i<DN;i++){dp[i*3]+=0;dp[i*3+2]+=0}
for(let i=0;i<9;i++)makeTumble();
updateChunks();updateGround(0,0);
let last=performance.now();
(function loop(t){
  const dt=Math.min(0.05,(t-last)/1000);last=t;
  update(dt);
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
})(last);
</script>
</body>
</html>
